[project]
name = "fnd-spinal-research"
version = "0.1.0"
description = "Research pipeline for Functional Neurological Disorder in spinal presentations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.35.0",
  "pandas>=2.2.0",
  "requests>=2.32.0",
  "plotly>=5.22.0",
  "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
